[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyfleet-command"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["skyfleet-contracts"]

[tool.uv.sources]
skyfleet-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/skyfleet_command"]