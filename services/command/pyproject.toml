[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyfleet-command"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "skyfleet-contracts",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
skyfleet-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/skyfleet_command"]
