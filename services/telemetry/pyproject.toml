[project]
name = "skyfleet-telemetry"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "paho-mqtt>=2.1",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "skyfleet-contracts",
    "uvicorn>=0.30",
]

[tool.uv.sources]
skyfleet-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyfleet_telemetry"]
