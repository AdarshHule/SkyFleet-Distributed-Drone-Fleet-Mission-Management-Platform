[project]
name = "skyfleet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["skyfleet-contracts", "skyfleet-edge", "skyfleet-telemetry", "skyfleet-gateway"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["contracts", "services/edge", "services/telemetry", "services/gateway"]

[tool.uv.sources]
skyfleet-contracts = { workspace = true }
skyfleet-edge = { workspace = true }
skyfleet-telemetry = { workspace = true }
skyfleet-gateway = { workspace = true }

[tool.ruff.lint.isort]
known-first-party = ["skyfleet_contracts", "skyfleet_edge"]
